AWSTemplateFormatVersion: '2010-09-09'
Description: Initial infrastructure for the AWS API Gateway assessment.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Settings
        Parameters:
          - ProjectName
          - Environment
          - StageName
      - Label:
          default: Lambda Settings
        Parameters:
          - OpenWeatherApiKey
          - LambdaArtifactsBucket
          - WeatherLambdaArtifactKey
          - CountryLambdaArtifactKey
      - Label:
          default: Cognito Settings
        Parameters:
          - CognitoUserPoolName
    ParameterLabels:
      ProjectName:
        default: Project Name
      Environment:
        default: Environment
      StageName:
        default: Stage Name
      OpenWeatherApiKey:
        default: OpenWeather API Key
      LambdaArtifactsBucket:
        default: Lambda Artifacts Bucket
      WeatherLambdaArtifactKey:
        default: Weather Lambda Artifact Key
      CountryLambdaArtifactKey:
        default: Country Lambda Artifact Key
      CognitoUserPoolName:
        default: Cognito User Pool Name

Parameters:
  ProjectName:
    Type: String
    Default: scansource-api
    Description: Short name used for resource naming and tags.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment label.

  StageName:
    Type: String
    Default: dev
    Description: API Gateway stage name.

  OpenWeatherApiKey:
    Type: String
    NoEcho: true
    Description: API key used by the weather Lambda to call OpenWeatherMap.

  LambdaArtifactsBucket:
    Type: String
    Description: S3 bucket that stores packaged Lambda deployment artifacts.

  WeatherLambdaArtifactKey:
    Type: String
    Default: lambda1/weather.zip
    Description: S3 key for the packaged code from lambdas/lambda1.

  CountryLambdaArtifactKey:
    Type: String
    Default: lambda2/country.zip
    Description: S3 key for the packaged code from lambdas/lambda2.

  CognitoUserPoolName:
    Type: String
    Default: scansource-user-pool
    Description: Display name for the Cognito user pool.

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-api'
      Description: REST API for the AWS API Gateway assessment.
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref CognitoUserPoolName
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${Environment}-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  ApiGatewayCognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-cognito-authorizer'
      RestApiId: !Ref ApiGatewayRestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt CognitoUserPool.Arn

  # Package lambdas/lambda1 into a zip with compiled index.js before deployment.
  WeatherLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-weather'
      Description: Returns current weather data from OpenWeatherMap.
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          OPENWEATHER_API_KEY: !Ref OpenWeatherApiKey
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Ref WeatherLambdaArtifactKey
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Package lambdas/lambda2 into a zip before deployment.
  CountryLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-country'
      Description: Returns country information from the REST Countries API.
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaArtifactsBucket
        S3Key: !Ref CountryLambdaArtifactKey
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  WeatherApiGatewayResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: weather

  CountryApiGatewayResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: country

  WeatherApiGatewayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref WeatherApiGatewayResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiGatewayCognitoAuthorizer
      RequestParameters:
        method.request.querystring.city: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WeatherLambdaFunction.Arn}/invocations'

  CountryApiGatewayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref CountryApiGatewayResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiGatewayCognitoAuthorizer
      RequestParameters:
        method.request.querystring.name: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CountryLambdaFunction.Arn}/invocations'

  WeatherLambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WeatherLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/GET/weather'

  CountryLambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CountryLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/GET/country'

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - WeatherApiGatewayMethod
      - CountryApiGatewayMethod
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: !Sub 'Deployment for ${AWS::StackName}'

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: !Ref StageName
      Description: Development stage for API testing.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ApiBaseUrl:
    Description: Base URL for the deployed API stage.
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'

  WeatherEndpointUrl:
    Description: Full URL for the weather endpoint.
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/weather'

  CountryEndpointUrl:
    Description: Full URL for the country endpoint.
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/country'

  ApiGatewayRestApiId:
    Description: ID of the REST API.
    Value: !Ref ApiGatewayRestApi

  ApiGatewayCognitoAuthorizerId:
    Description: ID of the API Gateway Cognito authorizer.
    Value: !Ref ApiGatewayCognitoAuthorizer

  CognitoUserPoolId:
    Description: ID of the Cognito user pool.
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: ID of the Cognito user pool app client.
    Value: !Ref CognitoUserPoolClient
